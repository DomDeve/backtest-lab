# Zentrale Session-Tabelle (Referenz-Eröffnung je Epic). Einzige Quelle für Handelszeiten im Lab.
# Leser: src/core/sessions.js (JS) und tools/sessions.py (Python). Umrechnung nach UTC nur über die IANA-Zeitzone
# (Intl bzw. zoneinfo), nie über feste Offsets.
#
# Felder je Epic:
#   asset_class         index | fx | metal | energy | crypto | stock
#   reference_exchange  Börse, deren Eröffnung als Referenz gilt
#   calendar            Feiertagskalender (siehe calendars); Wochenende ist nie ein Handelstag
#   sessions            name -> open_local / close_local / tz (eine oder mehrere Sessions, erste = Hauptsession)
#   real_open           false = Konvention ohne echte Eröffnung (Krypto) -> kein ORB/VWAP
#   orb_vwap            true = für ORB/VWAP-Tests zugelassen; sonst exclude_reason
#   orb_vwap_sessions   optional: nur diese Sessions sind für ORB/VWAP zugelassen (Rest siehe validation)
#   data                Ordner mit Capital-M5-Kerzen (nur dann Validierung gegen Kursdaten möglich)
#   validation          Ergebnis von tools/sessions_validate.py (OK / Abweichung / keine klare Eröffnung / ungeprüft)
#
# Epic-Namen: Capital.com-Epics laut Lab-Daten (US100, DE40, EURUSD) bzw. übliche Capital-Bezeichnungen.
# Nicht über die API bestätigte Epics stehen auf capital_checked: false (Schritt 2 offen, siehe tools/capital_hours.py).
# Hartkodierte Zeiten in strategies-live/*.js (Original-Code der n8n-Bots) bleiben unverändert – sie werden nicht editiert.
#
# Schreibweise: eingeschränktes YAML (Einrückung 2 Leerzeichen, Maps, Inline-Listen [a, b], Skalare). Keine Anker/Mehrzeiler.


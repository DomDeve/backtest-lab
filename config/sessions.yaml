# Aktien-CFDs: Heimatbörse aus Epic/Instrumentname ableiten (tools/sessions.py: stock_home()).
# Regeln werden der Reihe nach geprüft; Treffer -> Sessions und Kalender der Börse. Kein Treffer -> unbekannt (kein ORB/VWAP).
stock_rules:
  us:
    match: "(?i)(\\bNASDAQ\\b|\\bNYSE\\b|\\bUSD\\b|\\.US$|_US$|Inc\\.?$|Corp\\.?$)"
    exchange: NYSE / Nasdaq
    calendar: XNYS
    open_local: "09:30"
    close_local: "16:00"
    tz: America/New_York
  de:
    match: "(?i)(\\bXETRA\\b|\\.DE$|_DE$|\\bAG$|\\bSE$)"
    exchange: Xetra
    calendar: XETR
    open_local: "09:00"
    close_local: "17:30"
    tz: Europe/Berlin
  uk:
    match: "(?i)(\\bLSE\\b|\\.L$|_UK$|\\bplc$|\\bGBX\\b)"
    exchange: London Stock Exchange
    calendar: XLON
    open_local: "08:00"
    close_local: "16:30"
    tz: Europe/London
  fr:
    match: "(?i)(\\.PA$|_FR$|\\bS\\.?A\\.?$)"
    exchange: Euronext Paris
    calendar: XPAR
    open_local: "09:00"
    close_local: "17:30"
    tz: Europe/Paris

# Feiertage nach Volumen (< 30 % des Durchschnitts der Hauptsession) erzeugt tools/sessions_validate.py in
# config/sessions_no_trading_days.json – beide Leser behandeln diese Tage zusätzlich als „kein Handelstag“.
